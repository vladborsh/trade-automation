<div class="body" role="status" aria-live="polite" [attr.aria-label]="label()">
  @if (variant() === 'skeleton') {
    @for (bar of bars(); track bar) {
      <span class="bar" [class.first]="bar === 0" [class.last]="bar === bars().length - 1"></span>
    }
  } @else {
    <span class="ring" aria-hidden="true"></span>
    @if (label()) {
      <span class="text">{{ label() }}</span>
    }
  }
</div>
