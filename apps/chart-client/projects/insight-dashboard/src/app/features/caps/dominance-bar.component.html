<p class="total">{{ total() }}</p>
<div class="bar" role="img" [attr.aria-label]="all()" [attr.title]="all()">
  @for (s of segments(); track s.key) {
    <span class="seg" [class.dark]="s.ink === 'dark'" [style.left.%]="s.left" [style.width.%]="s.pct" [style.background]="s.colour">
      @if (s.inside) {
        <span class="in num">{{ label(s) }}</span>
      }
    </span>
  }
</div>
<p class="muted">{{ t('caps.dominance.stablesCounted', { count: dominance().stablesCounted }) }}</p>
