<div class="plot" [attr.title]="t('caps.treemap.tap')">
  <svg class="chart" [attr.viewBox]="'0 0 ' + width() + ' ' + height()" [attr.width]="width()" [attr.height]="height()"
       role="img" [attr.aria-label]="legend()">
    @for (tile of tiles(); track tile.item.id) {
      <g (click)="pick(tile.item.id)" [class.selected]="tile.item.id === selected()">
        <rect [attr.x]="tile.x" [attr.y]="tile.y" [attr.width]="tile.w" [attr.height]="tile.h" [attr.fill]="tile.fill" rx="4">
          <title>{{ describe(tile.item) }}</title>
        </rect>
        @if (tile.big) {
          <text class="sym big" [attr.x]="tile.x + 12" [attr.y]="tile.y + 28">{{ tile.item.symbol }}</text>
          <text class="foot num" [attr.x]="tile.x + 12" [attr.y]="tile.y + tile.h - 12">{{ capLine(tile.item) }}</text>
        } @else {
          @if (tile.text !== 'none') {
            <text class="sym" [attr.x]="tile.x + 6" [attr.y]="tile.y + 17">{{ tile.item.symbol }}</text>
          }
          @if (tile.text === 'full') {
            <text class="chg num" [attr.x]="tile.x + 6" [attr.y]="tile.y + 32">{{ change(tile.item) }}</text>
          }
        }
      </g>
    }
  </svg>
</div>
@if (detail(); as d) {
  <p class="detail">{{ d }}</p>
}
