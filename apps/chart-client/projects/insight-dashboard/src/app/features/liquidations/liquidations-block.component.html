@let v = view();
@let block = overview().block;
<div class="liq" id="liquidations">
  <app-card class="hourly" [heading]="hourlyTitle()" [subtitle]="t('liq.hourly.legend')">
    <app-liq-hourly [hourly]="block.hourly" [totals]="v.totals" [note]="say(v.hourlyNote)" />
    @if (say(v.present); as present) {
      <p class="muted">{{ present }}</p>
    }
    @if (say(v.venues); as missing) {
      <p class="warn">{{ missing }}</p>
    }
  </app-card>

  <app-card class="where" [heading]="t('liq.where.title')" [subtitle]="t('liq.where.subtitle', { period: periodLabel() })">
    <app-liq-where [perCoin]="block.perCoin" [other]="block.otherCoins" [note]="say(v.whereNote)" [period]="period()" />
    @if (say(v.tradfi); as tradfi) {
      <p class="muted">{{ tradfi }}</p>
    }
    @if (say(v.unknown); as unknown) {
      <p class="muted">{{ unknown }}</p>
    }
  </app-card>

  <app-card class="large" [heading]="t('liq.large.title')" [subtitle]="t('liq.large.subtitle', { usd: largeMin() })">
    <app-liq-large
      [large]="block.large"
      [minUsd]="block.largeMinUsd"
      [from]="v.window.from"
      [to]="v.window.to"
      [bucketSec]="block.hourly.bucketSec"
      [note]="say(v.largeNote)"
    />
    <app-block-conclusion cardConclusion [line]="line()" [period]="period()" />
  </app-card>
</div>
