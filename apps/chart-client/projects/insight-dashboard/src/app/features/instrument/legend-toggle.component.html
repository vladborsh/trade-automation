<button
  type="button"
  class="legend-toggle"
  [attr.aria-pressed]="!hidden()"
  [attr.aria-label]="hidden() ? t('instrument.legends.show') : t('instrument.legends.hide')"
  [attr.title]="hidden() ? t('instrument.legends.show') : t('instrument.legends.hide')"
  (click)="toggle()"
>
  <!-- an eye: open while the legends show, struck through while they are hidden -->
  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
    <path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.4" />
    <circle cx="8" cy="8" r="2" fill="currentColor" />
    @if (hidden()) {
      <path class="strike" d="M2.5 13.5l11-11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    }
  </svg>
</button>
