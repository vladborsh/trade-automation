<article class="panel" [attr.data-panel]="panel().key">
  <header class="panel-head">
    <h3 class="panel-title">{{ heading() }}</h3>
    @if (panel().legend.length > 0) {
      <ul class="legend">
        @for (entry of panel().legend; track entry.labelKey) {
          <li><span class="swatch" [style.background]="entry.colour"></span>{{ t(entry.labelKey) }}</li>
        }
      </ul>
    }
  </header>
  <div #panelHost class="panel-host"></div>
</article>
