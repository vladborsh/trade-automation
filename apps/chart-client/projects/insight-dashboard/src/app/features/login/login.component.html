<section class="auth">
  <h1>{{ t('login.title') }}</h1>
  @if (saved()) {
    <p class="ok" role="status">{{ t('login.saved') }}</p>
  }
  <form (submit)="submit($event)">
    <label>
      <span>{{ t('login.login') }}</span>
      <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required
             [value]="login()" (input)="login.set($any($event.target).value)" />
    </label>
    <label>
      <span>{{ t('login.password') }}</span>
      <input name="password" type="password" autocomplete="current-password" required
             [value]="password()" (input)="password.set($any($event.target).value)" />
    </label>
    @if (error(); as e) {
      <p class="error" role="alert">{{ t(e.key, e.params) }}</p>
    }
    <button type="submit" [disabled]="busy()">{{ busy() ? t('login.signingIn') : t('login.submit') }}</button>
  </form>
  <!-- P2: the bot is where a password comes from (set or reset). No handle known → no handle shown. -->
  @if (botUsername(); as bot) {
    <p class="muted hint">{{ t('login.noPassword', { bot }) }}</p>
  } @else {
    <p class="muted hint">{{ t('login.noPasswordNoBot') }}</p>
  }
  <!-- §11: the login page has no member yet, so it carries its own switch. -->
  <button type="button" class="lang" (click)="toggleLang()">{{ t('login.switchLang') }}</button>
</section>
