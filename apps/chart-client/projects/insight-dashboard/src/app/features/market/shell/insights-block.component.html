<section class="insights" id="insights">
  <h2>{{ t('insight.title') }}</h2>
  @if (cards().length > 0) {
    <ol class="cards">
      @for (card of cards(); track card.id) {
        <li><app-insight-card [statement]="card.statement" [nowSec]="card.nowSec" /></li>
      }
    </ol>
  } @else if (insights()) {
    <div class="cards">
      <article class="neutral-card" [class]="'tone-' + neutral().chip.tone" [attr.title]="neutralChoice().basis ? basisText(neutral().basis) : null">
        <p class="meta"><span class="chip">{{ t(neutral().chip.key) }}</span></p>
        <p class="neutral">{{ neutralText() }}</p>
      </article>
    </div>
  }
</section>
