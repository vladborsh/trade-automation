<div class="switch" role="group" [attr.aria-label]="t('market.period.label')">
  @for (p of periods; track p) {
    <button type="button" [class.active]="p === period()" [disabled]="!availability(p).available"
            [attr.aria-pressed]="p === period()" [attr.title]="hint(p)"
            [attr.aria-describedby]="p === '7d' && weekNote() ? weekNoteId : null" (click)="pick(p)">
      {{ label(p) }}
    </button>
  }
</div>
<!-- IB-106 (§7.2): «7д: доступно с …» is the 7д button's tooltip and description, not a line under the switch -->
@if (weekNote(); as note) {
  <span class="sr-only" [id]="weekNoteId">{{ note }}</span>
}
