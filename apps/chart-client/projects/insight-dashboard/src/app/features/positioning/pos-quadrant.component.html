@let l = layout();
<svg class="chart" [attr.viewBox]="'0 0 ' + width() + ' ' + height()" [attr.width]="width()" [attr.height]="height()"
     role="img" [attr.aria-label]="t('positioning.quadrant.axes')">
  <line class="axis" [attr.x1]="pad" [attr.x2]="width() - pad" [attr.y1]="l.y0" [attr.y2]="l.y0" />
  <line class="axis" [attr.x1]="l.x0" [attr.x2]="l.x0" [attr.y1]="pad" [attr.y2]="height() - pad" />
  <text class="corner" x="4" y="14">{{ t('insight.quadrant.new_shorts') }}</text>
  <text class="corner end" [attr.x]="width() - 4" y="14">{{ t('insight.quadrant.new_longs') }}</text>
  <text class="corner" x="4" [attr.y]="height() - 4">{{ t('insight.quadrant.long_closing') }}</text>
  <text class="corner end" [attr.x]="width() - 4" [attr.y]="height() - 4">{{ t('insight.quadrant.short_closing') }}</text>
  <text class="tick" [attr.x]="width() - pad" [attr.y]="l.y0 - 4">{{ axis(l.xMax) }}</text>
  <text class="tick start" [attr.x]="pad" [attr.y]="l.y0 - 4">{{ axis(-l.xMax) }}</text>
  <text class="tick start" [attr.x]="l.x0 + 4" [attr.y]="pad + 10">{{ axis(l.yMax) }}</text>
  @for (d of l.dots; track d.row.symbol) {
    <circle [class]="d.row.quadrant ?? 'flat'" [class.selected]="d.row.symbol === selected()" [attr.cx]="d.cx" [attr.cy]="d.cy" [attr.r]="d.r" (click)="pick(d.row.symbol)">
      <title>{{ d.row.base }}</title>
    </circle>
    @if (d.label; as lb) {
      <!-- IB-108 (§7.6): the label as the mockup's pill, in its quadrant's colour; the dot keeps OI's size -->
      <rect [class]="'pill ' + (d.row.quadrant ?? 'flat')" [attr.x]="lb.box.x - 3" [attr.y]="lb.box.y - 1" [attr.width]="lb.box.w + 6" [attr.height]="lb.box.h + 2" rx="8" />
      <text class="label num" [attr.x]="lb.x" [attr.y]="lb.y" [attr.text-anchor]="lb.anchor">{{ d.row.base }}</text>
    }
  }
</svg>
<p class="muted">{{ detail() ?? t('positioning.quadrant.tap') }}</p>
<p class="muted">{{ t('positioning.quadrant.axes') }}</p>
@if (l.unplaced > 0) {
  <p class="muted">{{ t('positioning.quadrant.unplaced', { count: l.unplaced }) }}</p>
}
