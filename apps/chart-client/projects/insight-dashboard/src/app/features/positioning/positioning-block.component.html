<section class="block" id="positioning">
  <h2>{{ t('positioning.title') }}</h2>
  <div class="charts">
    <div class="panel">
      <h3>{{ t('positioning.quadrant.title') }}</h3>
      <app-pos-quadrant [rows]="positioning().rows" />
    </div>
    <div class="panel">
      <h3>{{ t('positioning.table.title') }}</h3>
      <app-pos-heat [rows]="positioning().rows" />
    </div>
  </div>
  <app-block-conclusion [line]="line()" [period]="period()" />
</section>
