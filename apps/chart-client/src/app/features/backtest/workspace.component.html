<div class="workspace">
  @if (session(); as s) {
    @if (engine(); as e) {
      <app-replay-toolbar
        [sessionName]="s.name"
        [sessionId]="s.id"
        [viewingAt]="e.viewOnly ? e.cursor() : null"
        [cursorMs]="e.cursor()"
        [timeframe]="e.timeframe()"
        [balance]="s.balance"
        [currency]="s.sessionCurrency"
        [loading]="e.blocked()"
        [atEnd]="e.atEnd()"
        [completed]="e.completed()"
        [retrying]="store.retrying()"
        [notice]="store.notice()"
        [error]="e.error()"
        (step)="step()"
        (timeframeChange)="setTimeframe($event)"
      />
      @if (store.hint(); as hint) {
        <p class="hint" role="status">{{ hint }}</p>
      }
      @if (!e.viewOnly) {
        <!-- §9.3: editing the layout PATCHes the session — never while viewing the past -->
        <app-layout-editor />
      }
      <div class="grid">
        <app-panel-grid [panels]="panels()" [sources]="store.sources()" [timeframe]="e.timeframe()" />
      </div>
      <div class="bottom">
        <app-journal
          class="journal"
          [sessionId]="s.id"
          [orders]="store.portfolio.orders()"
          [currency]="s.sessionCurrency"
          [pricePrecision]="store.pricePrecision()"
        />
        <app-stats-summary
          class="stats"
          [stats]="store.portfolio.stats()"
          [drift]="store.portfolio.drift()"
          [sessionId]="s.id"
          [currency]="s.sessionCurrency"
        />
      </div>
    }
  } @else if (store.loadError(); as message) {
    <p class="message error" role="alert">Could not open the session: {{ message }}</p>
  } @else {
    <p class="message" role="status">Opening the session…</p>
  }
</div>
