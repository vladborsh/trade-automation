<!-- data-replay-started: the engine's first history is in — what e2e waits on before pointing at a chart -->
<div class="workspace" [attr.data-replay-started]="engine()?.started() ? '' : null">
  @if (session(); as s) {
    @if (engine(); as e) {
      <app-replay-toolbar
        [sessionName]="s.name"
        [sessionId]="s.id"
        [viewingAt]="e.viewOnly ? e.cursor() : null"
        [cursorMs]="e.cursor()"
        [timeframe]="e.timeframe()"
        [balance]="s.balance"
        [currency]="s.sessionCurrency"
        [loading]="e.blocked()"
        [stepReady]="e.started()"
        [stepQueued]="e.stepQueued()"
        [atEnd]="e.atEnd()"
        [completed]="e.completed()"
        [retrying]="store.retrying()"
        [notice]="store.notice()"
        [openRisk]="store.positions().openRisk"
        [error]="e.error()"
        (step)="step()"
        (timeframeChange)="setTimeframe($event)"
      />
      @if (store.hint(); as hint) {
        <p class="hint" role="status">{{ hint }}</p>
      }
      @if (!e.viewOnly) {
        <!-- §9.3: editing the layout PATCHes the session — never while viewing the past -->
        <app-layout-editor />
      }
      <div class="main">
        <div class="grid">
          <app-panel-grid [panels]="panels()" [sources]="store.sources()" [timeframe]="e.timeframe()" />
        </div>
        @if (!e.viewOnly) {
          <!-- placing, cancelling and closing are mutations too: none while viewing the past -->
          <aside class="side">
            <app-order-panel
              [draft]="activeDraft()?.draft ?? null"
              [lastClose]="activeDraft()?.lastClose ?? null"
              [pricePrecision]="activeDraft()?.precision ?? 2"
              [balance]="s.balance"
              [riskPct]="store.riskPct()"
              [notionalWarnMultiple]="s.notionalWarnMultiple"
              [currency]="s.sessionCurrency"
              (riskPctChange)="store.riskPctOverride.set($event)"
              (place)="order()"
            />
            <app-positions-panel
              class="positions"
              [rows]="store.positions().rows"
              [currency]="s.sessionCurrency"
              [pricePrecision]="store.pricePrecision()"
              (cancel)="store.cancelOrder($event)"
              (close)="store.closeOrder($event)"
            />
          </aside>
        }
      </div>
      <div class="bottom">
        <app-journal
          class="journal"
          [collapsible]="true"
          [sessionId]="s.id"
          [orders]="store.portfolio.orders()"
          [currency]="s.sessionCurrency"
          [pricePrecision]="store.pricePrecision()"
        />
        <app-stats-summary
          class="stats"
          [stats]="store.portfolio.stats()"
          [drift]="store.portfolio.drift()"
          [sessionId]="s.id"
          [currency]="s.sessionCurrency"
        />
      </div>
    }
  } @else if (store.loadError(); as message) {
    <p class="message error" role="alert">Could not open the session: {{ message }}</p>
  } @else {
    <p class="message" role="status">Opening the session…</p>
  }
</div>
