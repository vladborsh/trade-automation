<div class="panel-grid">
  @for (panel of panels(); track panel.id) {
    @if (isCollapsed(panel.id)) {
      <app-collapsed-panel-strip [panelId]="panel.id" [title]="titleFor(panel)" (restore)="expand(panel.id)" />
    } @else if (sourceFor(panel.id); as source) {
      @if (injectorFor(source); as inj) {
        <div class="panel-column">
          <ng-container
            *ngComponentOutlet="chartPanelComponent; inputs: panelInputs(panel, source); injector: inj"
          ></ng-container>
        </div>
      }
    }
  }
</div>
