<div class="chart-panel" [attr.data-panel-id]="panel().id">
  <div class="panel-header">
    <span class="panel-title">{{ title() }}</span>
    @if (caption(); as c) {
      <span class="metric-caption" data-testid="metric-caption" [title]="c.tooltip">{{ c.text }}</span>
    }
    <span class="venue-dot" [class]="'venue-' + venueStatus()"></span>
    <app-research-badge />
    @if (panel().kind === 'candles') {
      <span class="rsi-controls">
        <button
          type="button"
          class="rsi-chip"
          data-testid="rsi-toggle"
          [attr.aria-pressed]="rsiVisible()"
          [title]="rsiVisible() ? 'Hide RSI' : 'Show RSI'"
          (click)="toggleRsi()"
        >
          RSI
        </button>
        @if (rsiVisible()) {
          <input
            #rsiPeriodInput
            type="number"
            class="rsi-period"
            data-testid="rsi-period"
            aria-label="RSI period"
            title="RSI period (2–100)"
            [min]="rsiMinPeriod"
            [max]="rsiMaxPeriod"
            step="1"
            [value]="rsiPrefs.period()"
            (change)="commitRsiPeriod(rsiPeriodInput)"
            (keydown.enter)="commitRsiPeriod(rsiPeriodInput)"
          />
        }
      </span>
    }
    <button
      type="button"
      class="collapse-btn"
      aria-label="Collapse panel"
      [disabled]="!canCollapse()"
      [title]="canCollapse() ? 'Collapse panel' : 'At least one panel stays open'"
      (click)="collapse()"
    >
      <span aria-hidden="true">&#x2039;</span>
    </button>
  </div>
  <div class="panel-body" [attr.data-metric-style]="metricStyle()">
    <app-chart
      [panelId]="panel().id"
      [kind]="panel().kind"
      [candles]="feed().candles.candles()"
      [points]="feed().points.points()"
      [overlays]="overlays()"
      [indicatorPoints]="feed().indicators.points()"
      [indicatorSpecs]="strategies.indicatorSpecs()"
      [timeframe]="timeframe.selected()"
      [rsiVisible]="rsiVisible()"
      [rsiPeriod]="rsiPrefs.period()"
      (loadOlderRequested)="onLoadOlder()"
    />
  </div>
</div>
