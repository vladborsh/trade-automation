<div class="chart-panel" [attr.data-panel-id]="panel().id">
  <div class="panel-header">
    <span class="panel-title">{{ title() }}</span>
    @if (caption(); as c) {
      <span class="metric-caption" data-testid="metric-caption" [title]="c.tooltip">{{ c.text }}</span>
    }
    @if (venueStatus(); as status) {
      <span class="venue-dot" [class]="'venue-' + status"></span>
    }
    <app-research-badge />
    <button
      type="button"
      class="collapse-btn"
      aria-label="Collapse panel"
      [disabled]="!canCollapse()"
      [title]="canCollapse() ? 'Collapse panel' : 'At least one panel stays open'"
      (click)="collapse()"
    >
      <span aria-hidden="true">&#x2039;</span>
    </button>
  </div>
  <div
    class="panel-body"
    [attr.data-metric-style]="metricStyle()"
    [attr.data-last-open]="lastBar()?.openTime"
    [attr.data-last-closed]="lastBar()?.closed"
    [attr.data-position-tools]="toolsHook()"
    [attr.data-pointer-price]="pointerPriceHook()"
  >
    <app-chart
      #chart
      [panelId]="panel().id"
      [kind]="panel().kind"
      [candles]="candles()"
      [points]="points()"
      [overlays]="overlays()"
      [indicatorPoints]="indicatorPoints()"
      [indicatorSpecs]="source().indicatorSpecs()"
      [indicatorLabels]="source().indicatorLabels ?? true"
      [whitespace]="whitespace()"
      [rightMarginPx]="source().rightMarginPx ?? 0"
      [timeframe]="tf()"
      [positionTools]="positionTools()"
      [positionToolsEnabled]="positionTools() !== null"
      (positionToolChange)="onPositionToolChange($event)"
      (loadOlderRequested)="onLoadOlder()"
    />
  </div>
</div>
