<main class="auth-page">
  <form class="auth-card" (submit)="submit($event)" novalidate>
    <h1>Sign in</h1>

    <label class="field">
      <span>Email</span>
      <input
        type="email"
        name="email"
        autocomplete="username"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        [attr.aria-invalid]="fieldErrors().email ? true : null"
      />
      @if (fieldErrors().email; as message) {
        <small class="field-error">{{ message }}</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        [attr.aria-invalid]="fieldErrors().password ? true : null"
      />
      @if (fieldErrors().password; as message) {
        <small class="field-error">{{ message }}</small>
      }
    </label>

    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
</main>
