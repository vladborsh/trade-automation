# Top-30 Binance USD-M perps by 30-day quote volume, revised by hand monthly
# (architecture/insight-bot-system-design.md §2.3, brief §3). Static on purpose.
#
# Measured 2026-09-28 (IB-003): fapi/v1/klines 1d, the 30 closed UTC days before that
# date, summed on quote volume. Tokenised equity and commodity perps (XAUUSDT, CLUSDT,
# SOXLUSDT, MSTRUSDT, NVDAUSDT, ...) rank inside the raw top 30 but are excluded: they have
# no Binance spot market, so no spot CVD and none of the crypto regime this bot reads.
# The filter is exactly that — a perp qualifies only if its base has a Binance spot USDT pair.
#
# listed_perp is the first bar in the data.binance.vision USD-M archive, which is what the
# backfill (§5) can actually start from; for the 2020-01 symbols the perp itself is older
# than the archive.

signal_set: [BTCUSDT, ETHUSDT, SOLUSDT]        # stage-1 playbooks evaluate only these

symbols:
