    base: BTC
    quote: USDT
    binance_perp: BTCUSDT
    binance_spot: BTCUSDT
    bybit_linear: BTCUSDT
    okx_swap: BTC-USDT-SWAP
    listed_perp: 2020-01-01
    # 30d quote volume 326.2bn USD
