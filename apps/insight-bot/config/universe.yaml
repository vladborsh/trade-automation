# Top-30 Binance USD-M perps by 30-day quote volume, revised by hand monthly
# (architecture/insight-bot-system-design.md §2.3, brief §3). Static on purpose.
#
# Measured 2026-09-28 (IB-003): fapi/v1/klines 1d, the 30 closed UTC days before that
# date, summed on quote volume. Tokenised equity and commodity perps (XAUUSDT, CLUSDT,
# SOXLUSDT, MSTRUSDT, NVDAUSDT, ...) rank inside the raw top 30 but are not part of it: they
# have no Binance spot market, so no spot CVD and none of the crypto regime this bot reads.
# The volume ranking is exactly that — the top 30 perps whose base has a Binance spot USDT pair.
#
# TradFi perps are no longer excluded as a rule (IB-070, 2026-10-30): they are ADDED BY HAND, by
# the user's decision, and listed AFTER the crypto top 30 with ranks 31+, whatever their volume
# (XAUUSDT 50.0bn and CLUSDT 25.6bn over 2026-09-30..10-29 would rank ~4th and ~7th). Putting
# them at the end keeps every "top 20" that means "top 20 crypto" — market-cap shares, the
# liquidation overview, the market context coins — exactly as it was. Binance's commodity perps
# and the two index perps (SPY, QQQ) are in; single stocks are not. They carry no binance_spot
# (no spot CVD; those features are null for them, §2.3, and /health lists them under noSpot) and
# no coingecko_id (no market-cap series). Their Bybit/OKX mapping was checked by price like
# IB-036's ids, see the block below.
#
# Binance REST weight of the ten TradFi entries (documented weights, not measured): the OI/LS
# poller's 5 calls per symbol per 5 min = +10 weight/min averaged (+50 inside a pass's minute);
# fundingRate at each settlement ≈ +0.05/min; gap repair as for any symbol. Degraded mode only:
# klines?limit=2 every 15 s = +40 weight/min. The picker's /universe/summary reads one
# openInterestHist per listed symbol per cached minute: +10/min while a dashboard tab is open.
# Steady state ≈ +10 of 2400 weight/min (0.4 %), +20 with a dashboard open.
#
# listed_perp is the first bar in the data.binance.vision USD-M archive, which is what the
# backfill (§5) can actually start from; for the 2020-01 symbols the perp itself is older
# than the archive.
#
# coingecko_id (IB-036, added 2026-09-28) maps each perp to the coin whose market cap the
# dashboard charts. **Every id was verified by price, not by ticker.** Matching on symbol alone
# is hopeless — CoinGecko lists 12 coins with the symbol BTC and 21 with PEPE — and matching on
# the largest market cap among them is WRONG at least once: for ONE it picks `cross-2`
# ("ONEchain", 81 M USD cap) over `harmony` (39 M), while Binance's ONEUSDT perp tracks Harmony.
# The check that settles it is the price: each perp's mark against the coin's spot, allowing for
# the 1000x prefix on 1000PEPEUSDT. All 30 agree within 1 % on 2026-09-28 except ONE, which
# agrees with harmony (0.0025139 vs 0.00260048) and is off by 60x against cross-2.
# Re-run that check when this list is revised.
#
# asset_class (IB-084, market-page design D6) is REQUIRED on every symbol, with no default: the
# loader refuses a symbol without it. crypto = the coin top 30; tradfi = the hand-added block below
# (Binance contractType TRADIFI_PERPETUAL). Crypto totals, norms, ranks and insights count crypto
# only; TradFi is reported beside them. A spec cross-checks every value against Binance
# exchangeInfo (test/fixtures/binance/exchangeInfo-classes.json, captured 2026-11-03).

