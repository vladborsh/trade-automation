# Insight dashboard CI — unit tests and a production build of the second Angular project in the
# chart-client workspace (apps/chart-client/projects/insight-dashboard). The dashboard compiles
# chart-client feature code through a path alias, so it needs every lib that code imports built
# first: contracts, indicators, replay-core, calendar-core, market-data-core (IB-126: prior-levels). The production build is the same
# command the insight-bot Dockerfile runs.
name: insight-dashboard CI

on:
  push:
    branches: [master]
    paths:
      - 'apps/chart-client/**'
      - 'libs/**'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/insight-dashboard-ci.yml'
  pull_request:
    paths:
      - 'apps/chart-client/**'
      - 'libs/**'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/insight-dashboard-ci.yml'
  workflow_dispatch:

concurrency:
  group: insight-dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 24, as the repo and the chart-client test scripts assume
          cache: npm

      # The whole workspace: chart-client's package is named `chart-client`, and an install filtered
      # on a name that does not exist silently installs only the root — that was `ng: not found`.
      - name: Install
        run: npm ci

      - name: Build the libs the dashboard compiles against
        run: >-
          npm run build -w libs/contracts -w libs/indicators -w libs/replay-core -w libs/calendar-core -w libs/market-data-core

      - name: Unit tests
        working-directory: apps/chart-client
        run: npm run test:insight-dashboard

      - name: Production build
        working-directory: apps/chart-client
        run: npm run build:insight-dashboard -- --configuration production
