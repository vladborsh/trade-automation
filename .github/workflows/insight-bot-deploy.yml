# IB-013 — build the arm64 image, push it to ECR, then have SSM run the box's deploy script
# (design §7). Manual by default; the push trigger is commented out until the stack exists and the
# user has approved deploys.
#
# The image goes to GHCR (ECR is dropped — infra/insight-bot/COST-PLAN.md), pushed with GitHub's
# own GITHUB_TOKEN, so the build needs no AWS credentials at all. AWS is used for one verb: running
# the deploy script on the box through SSM, via OIDC.
#
# Repository variables (no secrets):
#   AWS_REGION            ap-northeast-1
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::<account>:role/insight-bot-deploy   (Terraform output)
#   INSTANCE_ID           i-…                                             (Terraform output)
name: insight-bot deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: false
        default: master
  # push:
  #   branches: [master]
  #   paths: ['apps/insight-bot/**', 'libs/**', 'infra/insight-bot/**', '.github/workflows/insight-bot-deploy.yml']

concurrency:
  group: insight-bot-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS
  contents: read
  packages: write # push the image to GHCR

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The commit actually checked out. With a `ref` input it differs from github.sha (the commit
      # the dispatch ran from), and the image tag must name what was built.
      - name: Resolve the built commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-qemu-action@v3 # arm64 on an x86 runner
      - uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/insight-bot/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/insight-bot:sha-${{ steps.rev.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/insight-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The box has no inbound port: the deploy runs through SSM (design §7, D11).
      - name: Run deploy.sh on the instance
        id: send
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy sha-${{ steps.rev.outputs.sha }}" \
            --parameters "commands=['/opt/insight-bot/deploy.sh sha-${{ steps.rev.outputs.sha }}']" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.INSTANCE_ID }}" || true

      - name: Report the deploy output
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output text
          status=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text)
          test "$status" = "Success"
