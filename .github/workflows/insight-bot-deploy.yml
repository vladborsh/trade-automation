# Build the arm64 insight-bot image, push it to ECR, name it in SSM, and have SSM run the box's
# deploy script (architecture/ecr-image-2026-11-03.md E6, E8, E10). Manual only.
#
# AWS identity: GitHub OIDC → the role insight-bot-deploy, which trusts workflows on master of this
# repository only. No long-lived keys. The role may push to the one ECR repository, write the one
# SSM parameter /insight-bot/IMAGE_TAG, and send the deploy command to the one instance.
#
# Tags are immutable `sha-<12-char commit>` (E2), never `latest`. A tag that already exists is not
# rebuilt: the job deploys the existing image instead (redeploy / rollback of a commit).
# The hand-run equivalent is infra/insight-bot/scripts/push-image.sh.
#
# Repository variables (no secrets):
#   AWS_REGION            ap-northeast-1
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::<account>:role/insight-bot-deploy   (tofu output deploy_role_arn)
#   INSTANCE_ID           i-…                                             (tofu output instance_id)
name: insight-bot deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build (the workflow itself always runs from master)
        required: false
        default: master

concurrency:
  group: insight-bot-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The commit actually checked out. With a `ref` input it differs from github.sha (the commit
      # the dispatch ran from), and the image tag must name what was built.
      - name: Resolve the built commit
        id: rev
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "tag=sha-${sha:0:12}" >>"$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Does this tag already exist?
        id: exists
        run: |
          if aws ecr describe-images --repository-name insight-bot \
               --image-ids imageTag="${{ steps.rev.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >>"$GITHUB_OUTPUT"
            echo "${{ steps.rev.outputs.tag }} is already in ECR — deploying it without a rebuild"
          else
            echo "found=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3 # arm64 on an x86 runner
        if: steps.exists.outputs.found == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - name: Build and push linux/arm64
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/insight-bot/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/insight-bot:${{ steps.rev.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # E10: the box deploys whatever this parameter names; a rollback is putting an older tag.
      - name: Name the image in SSM
        run: |
          aws ssm put-parameter --name /insight-bot/IMAGE_TAG --type String \
            --value "${{ steps.rev.outputs.tag }}" --overwrite >/dev/null

      # The box has no inbound port: the deploy runs through SSM (design §7, D11).
      - name: Run deploy.sh on the instance
        id: send
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.rev.outputs.tag }}" \
            --parameters "commands=['/opt/insight-bot/deploy.sh ${{ steps.rev.outputs.tag }}']" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.INSTANCE_ID }}" || true

      - name: Report the deploy output
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output text
          status=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text)
          test "$status" = "Success"
