name: Process master push
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: environment

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16.14

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build

  deploy:
    needs: integration
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Build Docker image
      env:
        ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        CMC_TOKEN: ${{ secrets.CMC_TOKEN }}
        CRYPTO_PANIC_TOKEN: ${{ secrets.CRYPTO_PANIC_TOKEN }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        CAPITAL_COM_API_KEY: ${{ secrets.CAPITAL_COM_API_KEY }}
        CAPITAL_COM_CUSTOM_PASS: ${{ secrets.CAPITAL_COM_CUSTOM_PASS }}
        CAPITAL_COM_IDENTIFIER: ${{ secrets.CAPITAL_COM_IDENTIFIER }}
        TECH_INDICATOR_SERVICE_URL: ${{ secrets.TECH_INDICATOR_SERVICE_URL }}
        TECH_INDICATOR_SERVICE_API_KEY: ${{ secrets.TECH_INDICATOR_SERVICE_API_KEY }}
        USER_STATE_TABLE_NAME: ${{ secrets.USER_STATE_TABLE_NAME }}
        ORDER_TABLE_NAME: ${{ secrets.ORDER_TABLE_NAME }}
        LOG_GROUP_NAME: ${{ secrets.LOG_GROUP_NAME }}
        ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        POSITION_CALCULATOR_URL: ${{ secrets.POSITION_CALCULATOR_URL }}
      run: |
        docker buildx build --platform=linux/amd64 \
          --build-arg ENVIRONMENT=$ENVIRONMENT \
          --build-arg TG_TOKEN=$TG_TOKEN \
          --build-arg CMC_TOKEN=$CMC_TOKEN \
          --build-arg CRYPTO_PANIC_TOKEN=$CRYPTO_PANIC_TOKEN \
          --build-arg AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          --build-arg AWS_SECRET_KEY=$AWS_SECRET_KEY \
          --build-arg AWS_REGION=$AWS_REGION \
          --build-arg BINANCE_API_KEY=$BINANCE_API_KEY \
          --build-arg BINANCE_SECRET_KEY=$BINANCE_SECRET_KEY \
          --build-arg CAPITAL_COM_API_KEY=$CAPITAL_COM_API_KEY \
          --build-arg CAPITAL_COM_CUSTOM_PASS=$CAPITAL_COM_CUSTOM_PASS \
          --build-arg CAPITAL_COM_IDENTIFIER=$CAPITAL_COM_IDENTIFIER \
          --build-arg TECH_INDICATOR_SERVICE_URL=$TECH_INDICATOR_SERVICE_URL \
          --build-arg TECH_INDICATOR_SERVICE_API_KEY=$TECH_INDICATOR_SERVICE_API_KEY \
          --build-arg USER_STATE_TABLE_NAME=$USER_STATE_TABLE_NAME \
          --build-arg ORDER_TABLE_NAME=$ORDER_TABLE_NAME \
          --build-arg LOG_GROUP_NAME=$LOG_GROUP_NAME \
          --build-arg POSITION_CALCULATOR_URL=$POSITION_CALCULATOR_URL \
          -t registry.heroku.com/$HEROKU_APP_NAME/web .

    - name: Login and Push to Heroku Container Registry
      env:
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        docker login --username=_ --password=$HEROKU_API_KEY registry.heroku.com
        docker push registry.heroku.com/$HEROKU_APP_NAME/web

    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh

    - name: Release image to Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        heroku container:release web -a $HEROKU_APP_NAME

