# The box's compose file (design §7). Lives at /opt/insight-bot/docker-compose.yml, written by
# user_data at first boot and updated by scripts/sync-box.sh (tofu ignores user_data changes). Local development does NOT use this file — it uses
# apps/insight-bot/docker-compose.yml against the single local Postgres (IB-003).
#
# postgres and insight-bot read /opt/insight-bot/.env, which the deploy step renders from SSM
# SecureStrings (root-only, 0600). cloudflared reads only /opt/insight-bot/cloudflared.env (the
# tunnel token, rendered by the same script and kept out of the app's .env — member-access design
# M4, IB-074). caddy reads only /opt/insight-bot/caddy.env (SITE_ADDRESS, IB-082). No secret is
# baked into the image or this file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tuned for the 1 GB t4g.micro of COST-PLAN.md (design §7's 512MB/50 assumed a 2 GB box).
    # A 2 GB swap file on the EBS volume absorbs bursts; see user_data.
    command: >-
      postgres
      -c shared_buffers=256MB
      -c max_connections=20
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_compression=on
    environment:
      POSTGRES_DB: insight
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/insight-bot/.env from SSM}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/insight-bot/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U insight -d insight']
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports: published. Only the bot and, through SSM port-forward, an operator reach it.
    expose:
      - '5432'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  insight-bot:
    image: ${IMAGE:?set by the deploy step}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /opt/insight-bot/.env
    environment:
      NODE_ENV: production
      PORT: '3005'
      DATABASE_URL: postgres://insight:${POSTGRES_PASSWORD}@postgres:5432/insight
    expose:
      - '3005'
    # WD-011: the liveness probe is /healthz ({status} only); /health is the dashboard's page now.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3005/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # The only service with published ports (https-without-domain H1, H3): https on
  # <a-b-c-d>.sslip.io in front of the app, which itself publishes nothing. Pinned by tag AND digest
  # (multi-arch index incl. linux/arm64); bump both together. caddy_data holds the certificate and
  # the ACME account (H5): it MUST persist, or every restart re-issues and walks into rate limits.
  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    depends_on:
      - insight-bot
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - /opt/insight-bot/caddy.env
    volumes:
      - /opt/insight-bot/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # DORMANT (https-without-domain H9): runs only with `--profile tunnel`, i.e. once there is a domain
  # and a tunnel token again (RUNBOOK §11, "later"). The 80/443 rules would then be closed.
  # Cloudflare named tunnel, remotely managed (token mode): https://<domain> -> http://insight-bot:3005.
  # The public hostname and its target are set in the Cloudflare dashboard, not here (RUNBOOK §11).
  # Outbound-only connection to Cloudflare: no published ports, the security group is unchanged.
  # Pinned by tag AND digest (multi-arch index, includes linux/arm64 for the t4g box); bump both
  # together, never to `latest` — and --no-autoupdate so the binary never replaces itself.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
      - insight-bot
    env_file:
      - /opt/insight-bot/cloudflared.env
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  caddy_data:
  caddy_config:
